[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-f75-hub"
version = "0.4.0"
description = "Linux configuration tool for the AULA F75 keyboard: lighting, per-key RGB, key remapping"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Baki Akyol" }]
requires-python = ">=3.10"
# Linux uses /dev/hidraw and Windows its HID API directly (ctypes); macOS goes through hidapi
dependencies = ["hidapi; sys_platform == 'darwin'"]
keywords = ["aula", "aula-f75", "keyboard", "rgb", "hidraw", "linux"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Environment :: X11 Applications :: GTK",
]

[project.urls]
Homepage = "https://github.com/bakiakyol/aula-f75-hub"
Issues = "https://github.com/bakiakyol/aula-f75-hub/issues"

[project.optional-dependencies]
gui = ["PyGObject"]

[project.scripts]
aula = "aula.cli:main"

[tool.setuptools]
packages = ["aula", "aula.backends"]
